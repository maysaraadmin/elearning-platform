      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql+asyncpg://elearning:elearning@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
