      - DATABASE_URL=postgresql+asyncpg://elearning:elearning@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/quiz-service:/app
      - ../../shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload

  progress-service:
