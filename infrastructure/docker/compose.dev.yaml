  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - USER_SERVICE_URL=http://user-service:8001
      - COURSE_SERVICE_URL=http://course-service:8002
      - VIDEO_SERVICE_URL=http://video-processor:8003
      - QUIZ_SERVICE_URL=http://quiz-service:8004
      - PROGRESS_SERVICE_URL=http://progress-service:8005
      - PAYMENT_SERVICE_URL=http://payment-service:8006
      - ANALYTICS_SERVICE_URL=http://analytics-service:8007
      - NOTIFICATION_SERVICE_URL=http://notification-service:8008
    depends_on:
      user-service:
        condition: service_started
      course-service:
        condition: service_started
    volumes:
      - ../../services/gateway-service:/app
      - ../../shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
