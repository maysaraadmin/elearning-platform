
include:
  - compose.yaml

services:
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://elearning:elearning@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/user-service:/app
      - ../../shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  course-service:
    build:
      context: ../..
      dockerfile: services/course-service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://elearning:elearning@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/course-service:/app
      - ../../shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload

  video-processor:
    build:
      context: ../..
      dockerfile: services/video-processor/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://elearning:elearning@postgres:5432/elearning
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../../services/video-processor:/app
      - ../../shared:/app/shared
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload

  quiz-service:
