apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: elearning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
        - name: course-service
          image: elearning/course-service:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: elearning-config
            - secretRef:
                name: elearning-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
