apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: elearning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: progress-service
  template:
    metadata:
      labels:
        app: progress-service
    spec:
      containers:
        - name: progress-service
          image: elearning/progress-service:latest
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: elearning-config
            - secretRef:
                name: elearning-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
