apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor
  namespace: elearning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-processor
  template:
    metadata:
      labels:
        app: video-processor
    spec:
      containers:
        - name: video-processor
          image: elearning/video-processor:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: elearning-config
            - secretRef:
                name: elearning-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
